[project]
name = "immersive-reading"
version = "0.3.0"
description = "Local, source-linked Japanese reading study packs"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5", "lxml>=5,<7", "sudachipy>=0.6.10,<0.8",
  "sudachidict_core>=20250129", "jsonschema>=4.23,<5", "packaging>=24,<27"
]

[project.optional-dependencies]
print = ["reportlab>=4,<6", "pymupdf==1.26.7", "fonttools>=4.55,<5", "pillow>=9,<14"]

[dependency-groups]
release = ["setuptools==80.9.0"]

[project.scripts]
immersive = "immersive.cli:main"
immersive-pipeline = "immersive.pipeline:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["immersive*"]

[tool.setuptools.package-data]
immersive = ["*.css", "*.js", "*.json"]
