name: Build & Release Single-File Packages

on:
  # Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) releases that commit. The tag must point at a commit that is on main.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Manual run: the release gets a date-and-run-number tag, as before.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Tag is on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge it to main, then tag the merged commit."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    # a manual run skips the tag check; a tag run needs it to pass
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            archive_ext: tar.gz
          - target: win-x64
            os: windows-latest
            archive_ext: zip
          - target: osx-arm64
            os: macos-latest
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'immersive-reader/src/ImmersiveReading.App/client/package-lock.json'

      - name: Install Frontend Dependencies & Build
        working-directory: immersive-reader/src/ImmersiveReading.App/client
        run: |
          npm ci
          npm run build

      - name: Set Release Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(date +'%Y-%m-%d')-${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish (Self-Contained Single-File)
        shell: bash
        run: |
          dotnet publish immersive-reader/src/ImmersiveReading.App/ImmersiveReading.App.csproj \
            -c Release \
            -r ${{ matrix.target }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:BuildReactClient=false \
            -o ./dist/immersive-reader

      - name: Clean Symbols (*.pdb)
        shell: bash
        run: |
          rm -f ./dist/immersive-reader/*.pdb

      - name: Package Release Archive (Linux tar.gz)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          mkdir -p ./release-pkg
          chmod +x ./dist/immersive-reader/ImmersiveReading.App
          ARCHIVE_NAME="immersive-reader-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czvf "./release-pkg/${ARCHIVE_NAME}" -C ./dist immersive-reader
          echo "archive_path=./release-pkg/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Package Release Archive (macOS tar.gz)
        if: matrix.target == 'osx-arm64'
        shell: bash
        run: |
          mkdir -p ./release-pkg
          chmod +x ./dist/immersive-reader/ImmersiveReading.App
          cat << 'EOF' > ./dist/immersive-reader/START-READER.command
          #!/bin/bash
          cd "$(dirname "$0")"
          exec ./ImmersiveReading.App "$@"
          EOF
          chmod +x ./dist/immersive-reader/START-READER.command
          ARCHIVE_NAME="immersive-reader-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czvf "./release-pkg/${ARCHIVE_NAME}" -C ./dist immersive-reader
          echo "archive_path=./release-pkg/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Package Release Archive (Windows zip)
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          mkdir -p ./release-pkg
          ARCHIVE_NAME="immersive-reader-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          python3 -c "import shutil; shutil.make_archive('./release-pkg/' + '${ARCHIVE_NAME}'.replace('.zip', ''), 'zip', './dist', 'immersive-reader')"
          echo "archive_path=./release-pkg/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_name }}
          path: ${{ env.archive_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set Release Tag, Name & Pre-release flag
        id: release_meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Immersive Reader ${TAG}"
          else
            DATE_STR="$(date +'%Y-%m-%d')"
            TAG="v${DATE_STR}-${{ github.run_number }}"
            NAME="Immersive Reader Release ${DATE_STR} (Run #${{ github.run_number }})"
          fi
          # v1.2.3-beta.1 is a pre-release; v1.2.3 is not
          case "${TAG}" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Inspect downloaded packages
        run: |
          ls -la ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ./artifacts/*
